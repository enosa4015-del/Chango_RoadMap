    function refresh() {
      var b = document.getElementById('themeToggle');

        document.documentElement.getAttribute('data-theme') === 'dark'
          ? '☀️'

  function highlight(lang, code) {

    code = escMin(code);

    var cfg =
      HL[lang] ||
      HL[lang.toLowerCase()] ||
      { k: [], s: [], c: [] };

    if (!cfg.s.length && !cfg.c.length && !cfg.k.length) {
      return code;
    }

    var saved = [];

    function protect(re, cls) {
      code = code.replace(re, function (m) {
        saved.push(
          '<span class="tok-' + cls + '">' + m + '</span>'
        );

        return '\u0000' + (saved.length - 1) + '\u0001';
      });
    }

    cfg.s.forEach(function (re) {
      protect(re, 's');
    });

    cfg.c.forEach(function (re) {
      protect(re, 'c');
    });

    if (cfg.v && cfg.v.length) {
      code = code.replace(
        new RegExp('(' + cfg.v.join('|') + ')\\b', 'g'),
        '<span class="tok-v">$1</span>'
      );
    }

    if (cfg.k && cfg.k.length) {
      code = code.replace(
        new RegExp('\\b(' + cfg.k.join('|') + ')\\b', 'g'),
        '<span class="tok-k">$1</span>'
      );
    }

    code = code.replace(
      /\b(\d+(\.\d+)?)\b/g,
      '<span class="tok-n">$1</span>'
    );

    code = code.replace(
      /\u0000(\d+)\u0001/g,
      function (m, i) {
        return saved[+i];
      }
    );

    return code;
  }


  function hlOrPass(code) {
    return /<\/?span/.test(code)
      ? code
      : highlight(null, code);

  /* code blocks */

  function renderCodeBlock(block) {

    var lang = block.lang || 'php';

    var html =

    html +=

    html +=
      '</div><pre><code>' +
      (
        block.pre
          ? block.code
          : highlight(lang, block.code)
      ) +
      '</code></pre></div>';

    return html;
  }


  /* explanation array */

  function renderExplanation(arr) {

    var html = '';

    arr.forEach(function (item) {

      if (item.tag === 'heading') {
        html += '<h3>' + item.text + '</h3>';
      } else {
        html += '<p>' + item.text + '</p>';
      }

    });

    return html;
  }

if (!l) { document.getElementById('lessonMain').innerHTML = '<div style="text-align:center;padding:8rem 2rem;"><h1>Lesson Not Found</h1><p style="color:var(--text-muted);margin:1rem 0;">This lesson doesn\'t exist yet. You probably followed a link from the future.</p><a href="backend.html" class="btn btn-primary">← Back to Roadmap</a></div>'; return; }

      html +=

        l.next.slug +
        '">' +
        esc(l.next.title) +
        ' →</a>';

    } else {

      html +=
        '<a class="btn btn-primary btn-sm" href="backend.html">🎉 Level Complete →</a>';
    }

    html += '</div></div>';

    document.getElementById('lessonMain').innerHTML = html;

    document.title =
      l.title +
      ' · Backend Roadmap | Chango';

    window.scrollTo(0, 0);
  }


  /* globals */

  window.currentSlug =
    getParam('lesson') ||
    'what-is-programming';


  window.copyCode = function (btn) {

    var pre =
      btn.closest('.code-block').querySelector('pre');

    var text = pre.textContent;

    function ok() {

      btn.textContent = 'Copied!';
      btn.classList.add('copied');

      setTimeout(function () {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2500);
    }

    function fallback() {

      var ta = document.createElement('textarea');

      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';

      document.body.appendChild(ta);

      ta.select();

      try {
        document.execCommand('copy');
      } catch (e) {}

      document.body.removeChild(ta);

      ok();
    }

    if (
      navigator.clipboard &&
      navigator.clipboard.writeText
    ) {

      navigator.clipboard
        .writeText(text)
        .then(ok)
        .catch(fallback);

    } else {

      fallback();
    }
  };


  window.answerQuiz = function (idx) {

    var l = LESSONS[window.currentSlug];

    if (!l || !l.quiz) return;

    var correct =
      l.quiz.correct === idx;

    var opts =
      document.querySelectorAll('.quiz-option');

    opts.forEach(function (o) {

      o.classList.add('disabled');

      var oi =
        parseInt(
          o.getAttribute('data-idx')
        );

      if (oi === l.quiz.correct) {
        o.classList.add('correct');
      } else if (oi === idx && !correct) {
        o.classList.add('wrong');
      }
    });

    var fb =
      document.getElementById('quizFeedback');

    fb.className =
      'quiz-feedback show ' +
      (correct ? 'right' : 'wrong');

    fb.textContent =
      correct
        ? l.quiz.feedback.correct
        : l.quiz.feedback.wrong;
  };


  window.toggleMark = function () {

    var slug = window.currentSlug;

    var btn =
      document.getElementById('markBtn');

    var done = getDone();

    if (done.indexOf(slug) !== -1) {

      removeDone(slug);

      btn.textContent =
        'Mark as Understood';

      btn.classList.remove('marked');

    } else {

      markDone(slug);

      btn.textContent =
        '✓ Understood';

      btn.classList.add('marked');
    }

    renderSidebar(slug);
  };


  window.toggleDrawer = function () {

    document
      .getElementById('lessonSide')
      .classList.toggle('open');

    document
      .getElementById('sideOverlay')
      .classList.toggle('show');
  };


  document
    .getElementById('sideOverlay')
    .addEventListener('click', function () {

      document
        .getElementById('lessonSide')
        .classList.remove('open');

      this.classList.remove('show');
    });


  renderSidebar(window.currentSlug);
  renderLesson(window.currentSlug);

})();
</script>
