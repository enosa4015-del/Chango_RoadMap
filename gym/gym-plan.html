<script>
 (function () {
 var saved = 'dark';
 try { saved = localStorage.getItem('changoTheme') || 'dark'; } catch (e) {}
 document.documentElement.setAttribute('data-theme', saved);
 function refresh() {
 var b = document.getElementById('themeToggle');
 if (!b) return;
 b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
 }
 window.toggleTheme = function () {
 var cur = document.documentElement.getAttribute('data-theme');
 var next = cur === 'dark' ? 'light' : 'dark';
 try { localStorage.setItem('changoTheme', next); } catch (e) {}
 document.documentElement.setAttribute('data-theme', next);
 refresh();
 };
 refresh();
 document.addEventListener('DOMContentLoaded', refresh);
 })();
</script>

function initMealBuilder(profile) {
 var mealDiet = profile.diet || 'none';

 function dietOK(f) {
  return f.tags.indexOf(mealDiet) !== -1;
 }
 function poolForTime(t) {
  var base = (FOODS_BY_MEAL[t] || []).map(gymFoodById).filter(Boolean).filter(dietOK);
  if (!base.length) base = FOODS.filter(dietOK);
  return base;
 }

 var times = ['breakfast', 'lunch', 'dinner', 'snack'];
 var timeLabels = ['☀️ Breakfast', '☀️ Lunch', '🌙 Dinner', 'Snack'];
 var tabs = document.getElementById('mbTabs');
 var recEl = document.getElementById('mbRec');
 var chipsEl = document.getElementById('mbFoodChips');
 var totalsEl = document.getElementById('mbTotals');
 var badgeEl = document.getElementById('mbFitBadge');
 var current = 0;
 var selected = {};

 var html = '';
 times.forEach(function (t, i) { html += '<button class="mtab' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' + timeLabels[i] + '</button>'; });
 tabs.innerHTML = html;

 tabs.querySelectorAll('.mtab').forEach(function (tab) {
  tab.addEventListener('click', function () {
  tabs.querySelectorAll('.mtab').forEach(function (t) { t.classList.remove('active'); });
  tab.classList.add('active');
  current = parseInt(tab.getAttribute('data-idx'), 10);
  renderFoods();
  renderRec();
  });
 });

 function renderRec(t) {
  t = t || times[current];
  var rec = gymMealRecommend(profile, t);
  var sel = selected[t] || {};
  var added = true;
  for (var i = 0; i < rec.foods.length; i++) { if (!sel[rec.foods[i]]) { added = false; break; } }
  var items = '';
  rec.items.forEach(function (n) { items += '<span class="food-tag">' + n + '</span>'; });
  var pct = Math.round(rec.kcal / rec.target * 100);
  recEl.innerHTML =
  '<div class="mb-rec-row">' +
  '<div class="mb-rec-main">' +
  '<div class="mb-rec-badge">🍽️ Recommended for this meal</div>' +
  '<div class="mb-rec-title">' + rec.title + '</div>' +
  '<div class="mb-rec-items">' + items + '</div>' +
  '<div class="mb-rec-meta">≈ <b>' + rec.kcal + ' kcal</b> · <b>' + rec.p + 'g protein</b> — target ' + rec.target + ' kcal (' + pct + '%)</div>' +
  '</div>' +
  '<div class="mb-rec-actions">' +
  (added
  ? '<button class="mb-rec-btn added" onclick="gymMbClear(\'' + t + '\')">✓ Added — Remove</button>'
  : '<button class="mb-rec-btn" onclick="gymMbAdd(\'' + t + '\')">Add this meal</button>') +
  '</div>' +
  '</div>';
 }

 window.gymMbAdd = function (t) {
  var rec = gymMealRecommend(profile, t);
  if (!selected[t]) selected[t] = {};
  rec.foods.forEach(function (id) { selected[t][id] = true; });
  setTab(times.indexOf(t));
  renderFoods();
  computeTotals();
  renderRec();
 };

 window.gymMbClear = function (t) {
  var rec = gymMealRecommend(profile, t);
  if (!selected[t]) return;
  rec.foods.forEach(function (id) { delete selected[t][id]; });
  setTab(times.indexOf(t));
  renderFoods();
  computeTotals();
  renderRec();
 };

 function setTab(i) {
  current = i;
  tabs.querySelectorAll('.mtab').forEach(function (t) { t.classList.remove('active'); });
  var cur = tabs.querySelector('.mtab[data-idx="' + i + '"]');
  if (cur) cur.classList.add('active');
 }

 function renderFoods() {
  var pool = poolForTime(times[current]);
  var out = '';
  pool.forEach(function (f) {
  var on = selected[times[current]] && selected[times[current]][f.id];
  out += '<button class="food-chip' + (on ? ' on' : '') + '" data-id="' + f.id + '">' + f.name + '</button>';
  });
  chipsEl.innerHTML = out;
  chipsEl.querySelectorAll('.food-chip').forEach(function (btn) {
  btn.addEventListener('click', function () {
  var fid = btn.getAttribute('data-id');
  if (!selected[times[current]]) selected[times[current]] = {};
  selected[times[current]][fid] = !selected[times[current]][fid];
  btn.classList.toggle('on');
  computeTotals();
  });
  });
 }

 function computeTotals() {
 var sel = selected[times[current]] || {};
 var total = { cal: 0, p: 0, c: 0, f: 0 };
 Object.keys(sel).forEach(function (k) {
 if (!sel[k]) return;
 var food = gymFoodById(k);
 if (!food) return;
 total.cal += food.cal;
 total.p += food.p;
 total.c += food.c;
 total.f += food.f;
 });
 var nutrition = computeNutrition(profile);
 var calPct = nutrition.target ? Math.round((total.cal / nutrition.target) * 100) : 0;
 var pPct = nutrition.protein ? Math.round((total.p / nutrition.protein) * 100) : 0;
 totalsEl.innerHTML =
 '<div class="mb-t"><div class="v">' + total.cal + '</div><div class="k">Calories (' + calPct + '%)</div></div>' +
 '<div class="mb-t"><div class="v">' + total.p + 'g</div><div class="k">Protein (' + pPct + '%)</div></div>' +
 '<div class="mb-t"><div class="v">' + total.c + 'g</div><div class="k">Carbs</div></div>' +
 '<div class="mb-t"><div class="v">' + total.f + 'g</div><div class="k">Fat</div></div>';
 var fit = calPct >= 60 && calPct <= 110 && pPct >= 25;
 badgeEl.innerHTML = '<div class="fit-badge' + (fit ? '' : ' off') + '">' + (fit ? 'Good — this meal fits your targets' : 'Adjust food to better match your targets') + '</div>';
 }

renderFoods();
  computeTotals();
  renderRec();
}

function sendChat(preset) {
 var input = document.getElementById('chatIn');
 var text = preset || (input ? input.value.trim() : '');
 if (!text) return;
 if (input) input.value = '';
 var body = document.getElementById('chatBody');
 body.innerHTML += '<div class="msg user">' + escHtml(text) + '</div>';
 var res = coachReply(text);
 var cls = 'msg bot' + (res.safe ? ' safe' : '');
 var safeTag = res.safe ? '<span class="safe-tag">Not medical advice — consult a professional</span>' : '';
 body.innerHTML += '<div class="' + cls + '">' + safeTag + escHtml(res.reply) + '</div>';
 body.scrollTop = body.scrollHeight;
 document.getElementById('chatSuggest').style.display = 'none';
}

function escHtml(str) {
 return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function initChat() { window.sendChat = sendChat; }

function logWeek(btn) {
 if (!btn) btn = event && event.target;
 var profile = gymLoadProfile();
 if (!profile) return;
 var data = gymLoadProgress(profile);
 var last = data.logs[data.logs.length - 1] || {};
 function num(id, fallback, minv, maxv) {
  var el = document.getElementById(id);
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v)) v = fallback;
  if (minv != null) v = Math.max(minv, v);
  if (maxv != null) v = Math.min(maxv, v);
  return Math.round(v * 10) / 10;
 }
 function whole(id, fallback, minv, maxv) {
  return Math.round(num(id, fallback, minv, maxv));
 }
 var newEntry = {
  week: data.logs.length + 1,
  weight: num('logWeight', last.weight != null ? last.weight : profile.weight, 20, 300),
  chest: num('logChest', last.chest != null ? last.chest : 95, 0, 200),
  waist: num('logWaist', last.waist != null ? last.waist : 82, 0, 220),
  arm: num('logArm', last.arm != null ? last.arm : 28, 0, 80),
  thigh: num('logThigh', last.thigh != null ? last.thigh : Math.round(profile.weight * 0.28), 0, 150),
  energy: whole('logEnergy', last.energy != null ? last.energy : 3, 1, 5),
  consistency: whole('logConsistency', last.consistency != null ? last.consistency : 70, 0, 100),
  performance: num('logPerformance', last.performance != null ? last.performance : 7, 0, 10)
 };
 data.logs.push(newEntry);
 gymSaveProgress(data);
 if (btn) { btn.textContent = '✓ Saved!'; btn.style.background = 'linear-gradient(135deg, #10B981, #3B82F6)'; }
 setTimeout(function () { window.location.reload(); }, 1200);
}

window.logWeek = logWeek;
</script>
